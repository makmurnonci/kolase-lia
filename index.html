<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kolase Pose WA</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#14201b;--mu:#5d6b65;--ac:#128c4a;--bd:#d9e0dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--card:#19211d;--tx:#eaf1ed;--mu:#9aaaa2;--ac:#2fc474;--bd:#2c3832;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1512;--card:#19211d;--tx:#eaf1ed;--mu:#9aaaa2;--ac:#2fc474;--bd:#2c3832;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px;font-family:inherit}
textarea{min-height:150px}
.btn{display:inline-block;padding:11px 16px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:15px;margin:10px 8px 0 0}
.btn.alt{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.hide{display:none}
#out img{width:100%;border-radius:10px;border:1px solid var(--bd)}
.hint{font-size:13px;color:var(--mu)}
</style></head><body><main>
<h1>📸 Kolase Pose untuk WhatsApp</h1>
<div class="tabs"><button id="t1" class="on">Prompt AI</button><button id="t2">Kolase Foto</button></div>

<section id="p1" class="card">
<label>Hijab</label><input id="hj" value="hitam">
<label>Atasan</label><input id="at" value="kemeja biru muda oversize">
<label>Bawahan</label><input id="bw" value="celana kulot hitam longgar">
<label>Sepatu</label><input id="sp" value="hak pendek warna krem">
<label>Aksesori</label><input id="ak" value="kacamata hitam, jam tangan hitam">
<label>Jumlah pose</label><input id="jp" type="number" min="2" max="8" value="6">
<button class="btn" id="gen">Buat Prompt</button>
<div id="res" class="hide">
<label>Hasil prompt (tempel ke AI generator gambar + foto referensi Anda)</label>
<textarea id="pr"></textarea>
<button class="btn" id="cp">Salin</button><button class="btn alt" id="wa">Kirim ke WhatsApp</button>
</div></section>

<section id="p2" class="card hide">
<label>Pilih file: JPG, PNG, PDF, atau ZIP (maks. 6 gambar dipakai)</label><input id="fi" type="file" accept="image/*,.pdf,.zip,application/pdf,application/zip" multiple>
<label>Atau pilih satu folder berisi foto</label><input id="fd" type="file" webkitdirectory multiple>
<label>Warna latar</label><input id="bgc" type="color" value="#e9ecef">
<button class="btn" id="mk">Buat Kolase</button>
<div id="out" style="margin-top:12px"></div>
<p class="hint hide" id="sv">Tekan lama gambar lalu pilih “Simpan/Bagikan” untuk mengirim ke WhatsApp.</p>
</section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=id=>document.getElementById(id);
try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}catch(e){}
function tab(n){$('p1').classList.toggle('hide',n!=1);$('p2').classList.toggle('hide',n!=2);$('t1').classList.toggle('on',n==1);$('t2').classList.toggle('on',n==2)}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);
const poses=["berjalan santai sambil tertawa, satu tangan di saku","duduk di tepi dengan kaki menjuntai, tampak samping","berdiri tampak belakang menoleh ke samping","duduk di lantai bersandar tangan, tertawa lepas","berdiri tangan bersilang di dada, tersenyum","berdiri melangkah, tangan di saku","bersandar santai menatap kamera","memegang ujung hijab, tampak samping"];
$('gen').onclick=()=>{
 const n=Math.min(8,Math.max(2,+$('jp').value||6));
 const p=`Kolase ${n} pose berbeda dalam satu gambar vertikal, foto studio fashion profesional, latar belakang polos abu-abu terang tanpa batas. Wanita berhijab ${$('hj').value}, mengenakan ${$('at').value}, ${$('bw').value}, sepatu ${$('sp').value}, ${$('ak').value}. Pose: ${poses.slice(0,n).map((x,i)=>(i+1)+') '+x).join('; ')}. Wajah, hijab, dan pakaian identik di semua pose (gunakan foto referensi terlampir). Pencahayaan softbox lembut, ultra realistis, resolusi tinggi, komposisi tersebar rapi dengan jarak antar pose.`;
 $('pr').value=p;$('res').classList.remove('hide')};
$('cp').onclick=async()=>{try{await navigator.clipboard.writeText($('pr').value);$('cp').textContent='Tersalin ✓'}catch(e){$('pr').select();document.execCommand('copy')}};
$('wa').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent($('pr').value),'_blank');
const IMG=/\.(jpe?g|png|webp|gif|bmp)$/i;
function loadUrl(u){return new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=u})}
async function fromPdf(buf){const d=await pdfjsLib.getDocument({data:buf}).promise;const o=[];for(let p=1;p<=Math.min(d.numPages,6);p++){const pg=await d.getPage(p);const v=pg.getViewport({scale:1.5});const c=document.createElement('canvas');c.width=v.width;c.height=v.height;await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;o.push(await loadUrl(c.toDataURL('image/jpeg',.9)))}return o}
async function gather(files){const o=[];for(const f of files){try{const n=f.name||'';
 if(f.type.startsWith('image/')||IMG.test(n))o.push(await loadUrl(URL.createObjectURL(f)));
 else if(f.type==='application/pdf'||/\.pdf$/i.test(n))o.push(...await fromPdf(await f.arrayBuffer()));
 else if(/\.zip$/i.test(n)||f.type.includes('zip')){const z=await JSZip.loadAsync(f);for(const e of Object.values(z.files)){if(e.dir||e.name.includes('__MACOSX'))continue;if(IMG.test(e.name))o.push(await loadUrl(URL.createObjectURL(await e.async('blob'))));else if(/\.pdf$/i.test(e.name))o.push(...await fromPdf(await e.async('arraybuffer')))}}
 }catch(e){}
 if(o.length>=6)break}return o.slice(0,6)}
$('mk').onclick=async()=>{
 $('out').textContent='Memproses file...';
 const fs=await gather([...$('fi').files,...$('fd').files]);
 if(fs.length<2){$('out').textContent='Butuh minimal 2 gambar (JPG/PNG/PDF/ZIP/folder).';return}
 const W=1080,H=1920,c=document.createElement('canvas');c.width=W;c.height=H;
 const x=c.getContext('2d');x.fillStyle=$('bgc').value;x.fillRect(0,0,W,H);
 const rows=Math.ceil(fs.length/2),cw=W/2,ch=H/rows,pad=24;
 for(let k=0;k<fs.length;k++){
  const im=fs[k];const col=k%2,row=Math.floor(k/2);
  const odd=(fs.length%2==1&&k==fs.length-1);
  const bw=(odd?W:cw)-pad*2,bh=ch-pad*2;
  const s=Math.min(bw/im.width,bh/im.height),w=im.width*s,h=im.height*s;
  const ox=(odd?0:col*cw)+pad+(bw-w)/2,oy=row*ch+pad+(bh-h)/2;
  x.drawImage(im,ox,oy,w,h)}
 $('out').innerHTML='';const g=new Image();g.src=c.toDataURL('image/jpeg',.92);$('out').appendChild(g);$('sv').classList.remove('hide')};
</script></body></html>
